name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_LOGIN_SERVER: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
  REGISTRY_USERNAME: ${{ secrets.AZURE_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
  IMAGE_NAME: agentic-platform
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker image
        run: |
          docker build -t $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG -f docker/Dockerfile .
          docker login -u $REGISTRY_USERNAME -p $REGISTRY_PASSWORD $REGISTRY_LOGIN_SERVER
          docker push $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
          docker tag $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:latest
          docker push $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Deploy to Azure Container Instances
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name agentic-platform \
            --image $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG \
            --registry-login-server $REGISTRY_LOGIN_SERVER \
            --registry-username $REGISTRY_USERNAME \
            --registry-password $REGISTRY_PASSWORD \
            --dns-name-label agentic-platform \
            --ports 5000 \
            --environment-variables \
              PORT=5000 \
              NODE_ENV=production \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              REDIS_URL="${{ secrets.REDIS_URL }}" \
              ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
              SESSION_SECRET="${{ secrets.SESSION_SECRET }}"
