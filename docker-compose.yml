services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: agentic-postgres
    environment:
      POSTGRES_DB: agentic_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agentic_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-network

  # Redis Cache & Queue
  redis:
    image: redis:7
    container_name: agentic-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-network

  # Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agentic-app
    ports:
      - "5000:5000"
    # .env supplies secrets (QUBRID_*, VERCEL_TOKEN, SESSION_SECRET).
    # Explicit environment below wins (service DNS must override localhost).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Free demo by default. For real AI generation, set MOCK_AGENTS=false in .env.
      MOCK_AGENTS: "${MOCK_AGENTS:-true}"
      DATABASE_URL: postgresql://admin:secure_password_change_me@postgres:5432/agentic_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-for-production
      SESSION_SECRET: dev-session-secret-change-for-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./generated-projects:/app/generated-projects
      - ./.tmp-downloads:/app/.tmp-downloads
    networks:
      - agentic-network
    healthcheck:
      # wget ships with alpine/busybox (curl does not)
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  agentic-network:
    driver: bridge
